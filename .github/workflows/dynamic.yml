name: dynamic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dyn:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update -qq
          export DEBIAN_FRONTEND=noninteractive
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get install -y -qq xvfb x11-utils tcpdump tshark strace net-tools dnsutils curl ca-certificates procps file binutils python3 zstd >/dev/null 2>&1 || true
          sudo apt-get install -y -qq libnss3 libnspr4 libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 libdrm2 libgbm1 libgtk-3-0t64 libpango-1.0-0 libcairo2 libx11-6 libx11-xcb1 libxcb-dri3-0 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libxkbcommon0 libexpat1 libdbus-1-3 libglib2.0-0t64 libc6 libgcc-s1 libstdc++6 >/dev/null 2>&1 || true
          which tcpdump tshark strace Xvfb curl python3

      - name: fetch materials
        run: |
          mkdir -p work/out work/strace work/out/snap_before
          cd work
          curl -fL --retry 3 --connect-timeout 20 -o ab.deb "https://download.scholar.edu.cn/AcademicBrowser/AcademicBrowser1.9.deb"
          curl -fL --retry 3 --connect-timeout 20 -o scholartools "https://download.scholar.edu.cn/tools/linux_amd64/scholartools"
          chmod +x scholartools
          sha256sum ab.deb scholartools | tee out/hashes.txt
          ls -l

      - name: extract
        run: |
          cd work
          sudo dpkg-deb -x ab.deb /
          dpkg-deb -c ab.deb > out/files.txt
          ls -l /opt/apps/cn.cas.client/files/bin | head -20
          echo "=== runner identity / ip ==="
          id
          curl -s -m 15 https://ifconfig.me || true; echo

      - name: static endpoints of client
        run: |
          cd work
          BIN=/opt/apps/cn.cas.client/files/bin
          strings -n 4 "$BIN/client" > out/strings_client.txt 2>/dev/null || true
          strings -n 4 "$BIN/libclient_ui.so.1.0.0" > out/strings_client_ui.txt 2>/dev/null || true
          grep -hoE 'https?://[A-Za-z0-9._~:/?#@!$&*+,;=%-]+' out/strings_client.txt out/strings_client_ui.txt 2>/dev/null | sort -u > out/client_urls.txt
          grep -iE 'cstnet|scholar\.work|scholar\.edu|oauth|client_id|client_secret|callback|/client/config|dns-query|205\.164|hosts' out/strings_client.txt out/strings_client_ui.txt 2>/dev/null | sort -u > out/client_endpoints.txt
          nm -C "$BIN/libclient_ui.so.1.0.0" 2>/dev/null | grep -i cstnet > out/cstnet_symbols.txt || true
          objdump -d -C "$BIN/libclient_ui.so.1.0.0" > out/client_ui_disasm.txt 2>/dev/null || true
          grep -A160 '<getCstnetId' out/client_ui_disasm.txt 2>/dev/null | head -260 > out/getCstnetId_disasm.txt || true
          echo "=== client_urls ==="; cat out/client_urls.txt | head -80
          echo "=== cstnet_symbols ==="; cat out/cstnet_symbols.txt
          echo "=== client_endpoints ==="; head -100 out/client_endpoints.txt

      - name: baseline snapshot
        run: |
          cd work
          sudo cat /etc/hosts > out/snap_before/hosts
          sudo sha256sum /etc/hosts | tee out/snap_before/hosts.sha
          sudo find /etc/ssl/certs -maxdepth 1 \( -type f -o -type l \) | sort > out/snap_before/ssl_certs.lst
          sudo sha256sum /etc/ssl/certs/* 2>/dev/null | sort > out/snap_before/ssl_certs.sha || true
          (sudo ls -la /usr/local/share/ca-certificates) > out/snap_before/local_ca.lst 2>&1 || true
          (sudo ls -la /etc/pki/ca-trust/source/anchors) > out/snap_before/pki_ca.lst 2>&1 || true
          cat /etc/resolv.conf > out/snap_before/resolv.conf
          echo baseline-ok

      - name: run CEF client under Xvfb with capture
        run: |
          cd work
          sudo tcpdump -i any -nn -s 0 -w out/cap.pcap 'port 53 or port 853 or port 443 or port 80 or port 784 or port 3478 or port 8080' > out/tcpdump.log 2>&1 &
          TCPDUMP_PID=$!
          sleep 2
          Xvfb :99 -screen 0 1280x800x24 > out/xvfb.log 2>&1 &
          XPID=$!
          sleep 2
          ( for i in $(seq 1 80); do echo "--- t=$i"; sudo ss -tnp 2>/dev/null | head -40; sudo ss -unp 2>/dev/null | head -20; sleep 2; done ) > out/ss.log 2>&1 &
          SSPID=$!
          BIN=/opt/apps/cn.cas.client/files/bin
          sudo env DISPLAY=:99 HOME=/root LD_LIBRARY_PATH="$BIN:$BIN/lib" timeout -s TERM -k 10 150 strace -f -ff -e trace=connect,sendto,sendmsg,openat,execve -s 200 -o out/strace/client "$BIN/startclient" --no-sandbox --disable-gpu --disable-dev-shm-usage > out/client.log 2>&1 || true
          sleep 3
          kill $SSPID 2>/dev/null || true
          sudo kill $TCPDUMP_PID 2>/dev/null || true
          kill $XPID 2>/dev/null || true
          sleep 1
          echo "=== client.log tail ==="; tail -60 out/client.log
          echo "=== processes ==="; ps -ef | grep -E 'client|cef|Xvfb' | grep -v grep | head -20

      - name: after-client snapshot and pcap analysis
        run: |
          cd work
          mkdir -p out/snap_after_client
          sudo cat /etc/hosts > out/snap_after_client/hosts
          sudo find /etc/ssl/certs -maxdepth 1 \( -type f -o -type l \) | sort > out/snap_after_client/ssl_certs.lst
          sudo sha256sum /etc/ssl/certs/* 2>/dev/null | sort > out/snap_after_client/ssl_certs.sha || true
          (sudo ls -la /usr/local/share/ca-certificates) > out/snap_after_client/local_ca.lst 2>&1 || true
          (sudo ls -la /etc/pki/ca-trust/source/anchors) > out/snap_after_client/pki_ca.lst 2>&1 || true
          diff -u out/snap_before/hosts out/snap_after_client/hosts > out/hosts_diff_client.txt 2>&1 || true
          diff -u out/snap_before/ssl_certs.lst out/snap_after_client/ssl_certs.lst > out/ssl_diff_client.txt 2>&1 || true
          diff -u out/snap_before/local_ca.lst out/snap_after_client/local_ca.lst > out/local_ca_diff_client.txt 2>&1 || true
          echo "=== hosts diff (client) ==="; cat out/hosts_diff_client.txt
          echo "=== ssl dir diff (client) ==="; cat out/ssl_diff_client.txt
          echo "=== tshark DNS queries ==="
          tshark -r out/cap.pcap -Y 'dns.flags.response==0' -T fields -e dns.qry.name -e dns.qry.type 2>/dev/null | sort | uniq -c | sort -rn | head -60 > out/dns_queries.txt || true
          cat out/dns_queries.txt
          echo "=== tshark SNI ==="
          tshark -r out/cap.pcap -Y 'tls.handshake.extensions_server_name' -T fields -e ip.dst -e tcp.dstport -e tls.handshake.extensions_server_name 2>/dev/null | sort | uniq -c | sort -rn | head -80 > out/sni.txt || true
          cat out/sni.txt
          echo "=== tshark HTTP hosts ==="
          tshark -r out/cap.pcap -Y 'http.request' -T fields -e ip.dst -e tcp.dstport -e http.host -e http.request.uri 2>/dev/null | sort | uniq -c | sort -rn | head -60 > out/http_hosts.txt || true
          cat out/http_hosts.txt
          echo "=== destinations by port ==="
          tshark -r out/cap.pcap -T fields -e ip.dst -e tcp.dstport -e udp.dstport 2>/dev/null | sort | uniq -c | sort -rn | head -60 > out/dests.txt || true
          cat out/dests.txt
          echo "=== outbound connects in strace ==="
          grep -hE 'connect\(' out/strace/client* 2>/dev/null | grep -vE 'AF_UNIX|AF_NETLINK' | sed 's/^[0-9]* *//' | sort | uniq -c | sort -rn | head -60 > out/strace_connects.txt || true
          cat out/strace_connects.txt
          echo "=== pcap size ==="; ls -l out/cap.pcap

      - name: scholartools install (in-package flow)
        run: |
          cd work
          sudo tee /etc/hosts < out/snap_before/hosts > /dev/null
          echo "=== help ==="
          sudo ./scholartools --help > out/scholartools_help.txt 2>&1 || true
          head -60 out/scholartools_help.txt
          echo "=== install ==="
          sudo timeout -s TERM -k 10 150 strace -f -e trace=execve,connect,openat,sendto -s 200 -o out/strace/scholartools_install.log ./scholartools install --non-interactive > out/scholartools_install.log 2>&1 || true
          tail -100 out/scholartools_install.log
          echo "=== hosts after scholartools ==="
          sudo cat /etc/hosts
          diff -u out/snap_before/hosts /etc/hosts > out/hosts_diff_scholartools.txt 2>&1 || true
          echo "=== hosts diff ==="; cat out/hosts_diff_scholartools.txt
          echo "=== CA dirs ==="
          sudo ls -la /usr/local/share/ca-certificates 2>&1 | tee out/st_local_ca_after.txt
          sudo ls -la /usr/local/etc/scholartools 2>&1 | tee -a out/st_local_ca_after.txt
          sudo ls -la /usr/local/etc/scholartools/certs 2>&1 | tee -a out/st_local_ca_after.txt
          echo "=== strace outbound ==="
          grep -hE 'connect\(' out/strace/scholartools_install.log 2>/dev/null | grep -vE 'AF_UNIX|AF_NETLINK' | sort | uniq -c | sort -rn | head -40 | tee out/st_connects.txt || true
          echo "=== execve ==="
          grep -hE 'execve' out/strace/scholartools_install.log 2>/dev/null | head -40 | tee out/st_execve.txt || true

      - name: scholartools curl tests
        run: |
          cd work
          for u in https://www.google.com/ https://scholar.google.com/ https://github.com/ https://en.wikipedia.org/; do
            n=$(echo "$u" | tr -c 'a-zA-Z0-9' '_')
            echo "##### $u"
            timeout 45 curl -v -L --max-time 40 --connect-timeout 15 -o "out/st_body_$n.html" -w 'code=%{http_code} size=%{size_download} ip=%{remote_ip} time=%{time_total}\n' "$u" > "out/st_curl_$n.txt" 2>&1 || true
            tail -30 "out/st_curl_$n.txt"
            echo "--- body head ---"; head -c 300 "out/st_body_$n.html" 2>/dev/null | tr -d '\0'; echo
          done

      - name: manual DoH + hosts pin + CA + curl
        run: |
          cd work
          sudo tee /etc/hosts < out/snap_before/hosts > /dev/null
          cat > out/doh.py <<'PY'
          import struct, ssl, urllib.request, json, socket

          def build_query(name, qtype=1):
              header = struct.pack('!HHHHHH', 0x1234, 0x0100, 1, 0, 0, 0)
              q = b''.join(bytes([len(p)]) + p.encode() for p in name.split('.')) + b'\x00'
              return header + q + struct.pack('!HH', qtype, 1)

          def skip_name(msg, off):
              while True:
                  l = msg[off]
                  if l == 0:
                      return off + 1
                  if l & 0xc0 == 0xc0:
                      return off + 2
                  off += 1 + l

          def parse(msg):
              tid, flags, qd, an, ns, ar = struct.unpack('!HHHHHH', msg[:12])
              off = 12
              for _ in range(qd):
                  off = skip_name(msg, off); off += 4
              ans = []
              for _ in range(an):
                  off = skip_name(msg, off)
                  rtype, rclass, ttl, rdlen = struct.unpack('!HHIH', msg[off:off+10]); off += 10
                  rd = msg[off:off+rdlen]; off += rdlen
                  if rtype == 1 and rdlen == 4:
                      ans.append(['A', socket.inet_ntoa(rd), ttl])
                  elif rtype == 28 and rdlen == 16:
                      ans.append(['AAAA', socket.inet_ntop(socket.AF_INET6, rd), ttl])
                  elif rtype == 5:
                      ans.append(['CNAME', rd.hex(), ttl])
                  else:
                      ans.append([rtype, rd.hex(), ttl])
              return {'rcode': flags & 0xf, 'rd': (flags >> 8) & 1, 'an': an, 'answers': ans}

          ctx = ssl.create_default_context()
          pins = []
          names = ['www.google.com','scholar.google.com','google.com','github.com','en.wikipedia.org','scholar.edu.cn','scholar.work','doh.scholar.work','doh.scholar.edu.cn']
          for host in ['doh.scholar.work','doh.scholar.edu.cn']:
              print('##### DoH endpoint', host)
              for name in names:
                  for qtype, label in [(1,'A'),(28,'AAAA')]:
                      try:
                          req = urllib.request.Request('https://%s/dns-query' % host, data=build_query(name,qtype),
                              headers={'Content-Type':'application/dns-message','Accept':'application/dns-message'})
                          with urllib.request.urlopen(req, timeout=20, context=ctx) as r:
                              body = r.read()
                              p = parse(body)
                              print('RESULT', host, name, label, r.status, len(body), json.dumps(p, ensure_ascii=False))
                              if host == 'doh.scholar.work' and label == 'A':
                                  for a in p['answers']:
                                      if a[0] == 'A':
                                          pins.append((a[1], name))
                      except Exception as e:
                          print('ERR', host, name, label, repr(e))
          with open('out/pin_entries.txt','w') as f:
              for ip, name in pins:
                  f.write('%s %s\n' % (ip, name))
          print('##### pin entries'); print(open('out/pin_entries.txt').read())
          PY
          python3 out/doh.py > out/doh_results.txt 2>&1 || true
          cat out/doh_results.txt
          echo "=== append pins to /etc/hosts ==="
          if [ -s out/pin_entries.txt ]; then
            sudo tee -a /etc/hosts < out/pin_entries.txt >/dev/null
          fi
          sudo cat /etc/hosts | tail -20
          echo "=== install Scholar root CA v1/v2 locally ==="
          sudo mkdir -p /usr/local/share/ca-certificates/scholar
          sudo tee /usr/local/share/ca-certificates/scholar/scholar_root_ca_v1.pem < certs/scholar_root_ca_v1.pem >/dev/null
          sudo tee /usr/local/share/ca-certificates/scholar/scholar_root_ca_v2.pem < certs/scholar_root_ca_v2.pem >/dev/null
          sudo update-ca-certificates > out/update_ca.txt 2>&1 || true
          tail -20 out/update_ca.txt
          echo "=== gateway TCP reachability ==="
          for ip in 205.164.50.201 205.164.50.205 205.164.50.207 205.164.50.209; do
            echo -n "$ip:443 -> "; timeout 12 bash -c "echo > /dev/tcp/$ip/443" 2>&1 && echo OPEN || echo "FAIL/$?"
          done | tee out/gateway_tcp.txt
          echo "=== curl with pinned hosts + CA ==="
          for u in https://www.google.com/ https://scholar.google.com/; do
            n=$(echo "$u" | tr -c 'a-zA-Z0-9' '_')
            echo "##### $u"
            timeout 45 curl -v -L --max-time 35 --connect-timeout 15 -o "out/m_body_$n.html" -w 'code=%{http_code} size=%{size_download} ip=%{remote_ip} time=%{time_total}\n' "$u" > "out/m_curl_$n.txt" 2>&1 || true
            tail -35 "out/m_curl_$n.txt"
            echo "--- body head ---"; head -c 400 "out/m_body_$n.html" 2>/dev/null | tr -d '\0'; echo
          done
          echo "=== curl DoH with CA only (sanity) ==="
          curl -sS -m 20 -o /dev/null -w 'doh_http=%{http_code} ip=%{remote_ip}\n' https://doh.scholar.work/dns-query || true

      - name: assemble report
        if: always()
        run: |
          cd work
          {
            echo "================ HASHES ================"; cat out/hashes.txt 2>/dev/null
            echo "================ CLIENT URLS ================"; head -80 out/client_urls.txt 2>/dev/null
            echo "================ CSTNET SYMBOLS ================"; cat out/cstnet_symbols.txt 2>/dev/null
            echo "================ CLIENT ENDPOINTS ================"; head -120 out/client_endpoints.txt 2>/dev/null
            echo "================ GETCSTNETID DISASM (head) ================"; head -160 out/getCstnetId_disasm.txt 2>/dev/null
            echo "================ CLIENT LOG TAIL ================"; tail -80 out/client.log 2>/dev/null
            echo "================ HOSTS DIFF AFTER CLIENT ================"; cat out/hosts_diff_client.txt 2>/dev/null
            echo "================ SSL DIR DIFF AFTER CLIENT ================"; cat out/ssl_diff_client.txt 2>/dev/null
            echo "================ LOCAL CA DIFF AFTER CLIENT ================"; cat out/local_ca_diff_client.txt 2>/dev/null
            echo "================ DNS QUERIES (client) ================"; cat out/dns_queries.txt 2>/dev/null
            echo "================ TLS SNI (client) ================"; cat out/sni.txt 2>/dev/null
            echo "================ HTTP HOSTS (client) ================"; cat out/http_hosts.txt 2>/dev/null
            echo "================ DESTINATIONS (client) ================"; cat out/dests.txt 2>/dev/null
            echo "================ STRACE CONNECTS (client) ================"; cat out/strace_connects.txt 2>/dev/null
            echo "================ SCHOLARTOOLS HELP ================"; head -80 out/scholartools_help.txt 2>/dev/null
            echo "================ SCHOLARTOOLS INSTALL LOG ================"; tail -120 out/scholartools_install.log 2>/dev/null
            echo "================ SCHOLARTOOLS HOSTS DIFF ================"; cat out/hosts_diff_scholartools.txt 2>/dev/null
            echo "================ SCHOLARTOOLS CA AFTER ================"; cat out/st_local_ca_after.txt 2>/dev/null
            echo "================ SCHOLARTOOLS CONNECTS ================"; cat out/st_connects.txt 2>/dev/null
            echo "================ SCHOLARTOOLS EXECVE ================"; cat out/st_execve.txt 2>/dev/null
            for f in out/st_curl_*.txt out/m_curl_*.txt; do echo "================ $f ================"; tail -35 "$f" 2>/dev/null; done
            echo "================ DOH RESULTS ================"; cat out/doh_results.txt 2>/dev/null
            echo "================ PIN ENTRIES ================"; cat out/pin_entries.txt 2>/dev/null
            echo "================ UPDATE CA ================"; tail -20 out/update_ca.txt 2>/dev/null
            echo "================ GATEWAY TCP ================"; cat out/gateway_tcp.txt 2>/dev/null
            echo "================ BODY HEADS ================"
            for f in out/st_body_*.html out/m_body_*.html; do echo "--- $f $(stat -c%s "$f" 2>/dev/null)"; head -c 300 "$f" 2>/dev/null | tr -d '\0'; echo; done
          } > out/REPORT.txt 2>&1
          wc -c out/REPORT.txt
          cat out/REPORT.txt

      - name: upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynreport
          path: |
            work/out/REPORT.txt
            work/out/cap.pcap
            work/out/
